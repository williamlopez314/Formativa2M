<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplicación con Control por Voz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f4f4f9;
      color: #333;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .status {
      font-weight: bold;
      color: #007bff;
    }
    .btn {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin: 5px 2px;
    }
    .btn:hover {
      background-color: #218838;
    }
    .indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #dc3545;
      margin-right: 8px;
    }
    .indicator.active {
      background-color: #28a745;
    }
  </style>
</head>
<body>

  <h1>Panel de Control por Voz</h1>
  
  <div class="card">
    <p><span id="dot" class="indicator"></span><strong>Micrófono:</strong> <span id="mic-status">Desconectado</span></p>
    <p><strong>Último comando oído:</strong> <i id="last-command">Ninguno</i></p>
  </div>

  <div class="card">
    <p><strong>Temporizador:</strong> <span id="timer-status" class="status">Pausado (00:00)</span></p>
    <p><strong>Fase actual:</strong> <span id="fase-status" class="status">Fase 1</span></p>
    <p><strong>Sección actual:</strong> <span id="seccion-status" class="status">Sección A</span></p>
    <p><strong>Pregunta actual:</strong> <span id="pregunta-status" class="status">Pregunta N° 1</span></p>
    <p><strong>Problema actual:</strong> <span id="problema-status" class="status">Problema N° 1</span></p>
  </div>

  <div class="card">
    <h3>Comandos directos (o habla por micrófono):</h3>
    <button id="btn-reanudar" class="btn" onclick="reanudarTemporizador()">Reanudar temporizador</button>
    <button id="btn-fase" class="btn" onclick="cambiarFase()">Cambiar de fase</button>
    <button id="btn-seccion" class="btn" onclick="cambiarSeccion()">Cambiar de sección</button>
    <button id="btn-pregunta" class="btn" onclick="siguientePregunta()">Siguiente pregunta</button>
    <button id="btn-problema" class="btn" onclick="siguienteProblema()">Siguiente problema</button>
  </div>

  <script>
    // Variables de estado
    let faseContador = 1;
    let seccionContador = 65; // Código ASCII para 'A'
    let preguntaContador = 1;
    let problemaContador = 1;

    // Reconocimiento de Voz
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      document.getElementById('mic-status').innerText = "Tu navegador no soporta reconocimiento de voz (usa Chrome o Edge).";
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = 'es-ES';
      recognition.continuous = true;
      recognition.interimResults = false;

      const commands = {
        "reanudar temporizador": () => reanudarTemporizador(),
        "cambiar de fase": () => cambiarFase(),
        "cambiar de sección": () => cambiarSeccion(),
        "siguiente pregunta": () => siguientePregunta(),
        "siguiente problema": () => siguienteProblema()
      };

      recognition.onstart = () => {
        document.getElementById('mic-status').innerText = "Escuchando...";
        document.getElementById('dot').classList.add('active');
      };

      recognition.onresult = (event) => {
        const lastResultIndex = event.results.length - 1;
        const transcript = event.results[lastResultIndex][0].transcript.trim().toLowerCase();
        
        document.getElementById('last-command').innerText = `"${transcript}"`;

        for (const [commandText, action] of Object.entries(commands)) {
          if (transcript.includes(commandText)) {
            action();
            break;
          }
        }
      };

      recognition.onend = () => {
        recognition.start();
      };

      recognition.start();
    }

    // Funciones de control
    function reanudarTemporizador() {
      document.getElementById('timer-status').innerText = "En ejecución (Corriendo)";
    }

    function cambiarFase() {
      faseContador++;
      document.getElementById('fase-status').innerText = `Fase ${faseContador}`;
    }

    function cambiarSeccion() {
      seccionContador++;
      const letra = String.fromCharCode(seccionContador);
      document.getElementById('seccion-status').innerText = `Sección ${letra}`;
    }

    function siguientePregunta() {
      preguntaContador++;
      document.getElementById('pregunta-status').innerText = `Pregunta N° ${preguntaContador}`;
    }

    function siguienteProblema() {
      problemaContador++;
      document.getElementById('problema-status').innerText = `Problema N° ${problemaContador}`;
    }
  </script>
</body>
</html>
