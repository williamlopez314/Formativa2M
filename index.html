<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Aplicación con Control por Voz</title>
</head>
<body>

  <!-- AQUÍ VA EL CONTENIDO VISIBLE DE TU PÁGINA (Botones, textos, preguntas, etc.) -->
  <h1>Mi Aplicación</h1>


  <!-- CÓDIGO DE CONTROL POR VOZ -->
  <script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      alert("Tu navegador no soporta el reconocimiento de voz. Usa Google Chrome o Edge.");
    } else {
      const recognition = new SpeechRecognition();
      
      recognition.lang = 'es-ES';
      recognition.continuous = true;
      recognition.interimResults = false;

      const commands = {
        "reanudar temporizador": () => reanudarTemporizador(),
        "cambiar de fase": () => cambiarFase(),
        "cambiar de sección": () => cambiarSeccion(),
        "siguiente pregunta": () => siguientePregunta(),
        "siguiente problema": () => siguienteProblema()
      };

      recognition.onresult = (event) => {
        const lastResultIndex = event.results.length - 1;
        const transcript = event.results[lastResultIndex][0].transcript.trim().toLowerCase();
        
        console.log("Dijiste: " + transcript);

        for (const [commandText, action] of Object.entries(commands)) {
          if (transcript.includes(commandText)) {
            action();
            break;
          }
        }
      };

      recognition.onend = () => {
        recognition.start();
      };

      recognition.start();
    }

    // --- AQUÍ CONECTAS TUS ACCIONES ---
    function reanudarTemporizador() {
      // Escribe aquí lo que hace tu temporizador al reanudar
    }

    function cambiarFase() {
      // Escribe aquí la acción para cambiar de fase
    }

    function cambiarSeccion() {
      // Escribe aquí la acción para cambiar de sección
    }

    function siguientePregunta() {
      // Escribe aquí la acción para ir a la siguiente pregunta
    }

    function siguienteProblema() {
      // Escribe aquí la acción para ir al siguiente problema
    }
  </script>
</body>
</html>
